# Backend API container. Run from backend/:
#   docker compose up --build                       API only (mock provider by default)
#   docker compose --profile ollama up --build      API + local Ollama (CPU)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile ollama up --build
#                                                   API + Ollama on an NVIDIA GPU
#   docker compose --profile postgres up -d postgres  local PostgreSQL 15 for the attendance store
# Pull models once: docker compose exec ollama ollama pull qwen2.5:7b-instruct
#                   docker compose exec ollama ollama pull nomic-embed-text
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:5173
      # Inside Docker, reach the ollama service by name (backend/.env localhost would point at the container).
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_URL:-http://ollama:11434}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  postgres:
    image: postgres:15
    profiles: ["postgres"]
    environment:
      # Local development only: trust auth, reachable from this machine only (127.0.0.1).
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: resolva
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ollama-models:
  postgres-data:
